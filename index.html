<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Sena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Formulario Sena</h1>
      <p class="subtitle">GRACIAS POR DEJAR SUS DATOS</p>

      <form>
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Please enter your name"
          required
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Please enter your email"
          required
        />

        <label for="age">Age</label>
        <input
          type="number"
          id="age"
          placeholder="Please enter your age"
          required
        />

        <label for="option">Choose an option</label>
        <select id="option">
          <option>Select One Option</option>
          <option>Option 1</option>
          <option>Option 2</option>
          <option>Option 3</option>
        </select>

        <label>Do you plan to buy a new car in the next 5 years?</label>
        <div class="radio-group">
          <label><input type="radio" name="buyCar" value="Yes" /> Yes</label>
          <label><input type="radio" name="buyCar" value="No" /> No</label>
          <label
            ><input type="radio" name="buyCar" value="Maybe" /> Maybe</label
          >
        </div>

        <label for="car-brand">What is your favorite car brand?</label>
        <select id="car-brand">
          <option>Select One Option</option>
          <option>Toyota</option>
          <option>Ford</option>
          <option>Chevrolet</option>
          <option>Honda</option>
        </select>

        <label>What type of means of transportation do you own?</label>
        <div class="checkbox-group">
          <label
            ><input type="checkbox" name="transport" value="Car" /> Car</label
          >
          <label
            ><input type="checkbox" name="transport" value="Boat" /> Boat</label
          >
          <label
            ><input type="checkbox" name="transport" value="Bicycle" />
            Bicycle</label
          >
          <label
            ><input type="checkbox" name="transport" value="Motorcycle" />
            Motorcycle</label
          >
          <label
            ><input type="checkbox" name="transport" value="Plane" />
            Plane</label
          >
          <label
            ><input type="checkbox" name="transport" value="Bike" /> Bike</label
          >
        </div>

        <label for="comments">Any comments or suggestions?</label>
        <textarea
          id="comments"
          placeholder="Please enter your comments"
        ></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
